{% extends "base.html" %}

{% block title %}Регистрация • Nightmare{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Регистрация</h1>
        <p class="auth-subtitle">Создай аккаунт, чтобы получить доступ к кабинету, магазину и статистике</p>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            <div class="form-group">
                <label>Ник (латиница)</label>
                <input type="text" name="username" required minlength="3" maxlength="32" value="{{ form.username if form else '' }}">
            </div>
            <div class="form-group">
                <label>Отображаемое имя</label>
                <input type="text" name="display_name" required value="{{ form.display_name if form else '' }}">
            </div>
            <div class="form-group">
                <label>Email (необязательно)</label>
                <input type="email" name="email" value="{{ form.email if form else '' }}">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label>Повтори пароль</label>
                <input type="password" name="password2" required minlength="6">
            </div>

            <button type="submit" class="btn-primary">Создать аккаунт</button>
        </form>

        <div class="auth-divider">или</div>

        <div class="auth-social">
            <a href="/auth/discord" class="btn-social btn-discord">
                <span>💬</span> Войти через Discord
            </a>
        </div>

        <p class="auth-footer">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>
</div>
{% endblock %}
