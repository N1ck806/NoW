<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 400 300"
     width="400"
     height="300"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- ============================================================
         ГРАДИЕНТЫ
         ============================================================ -->

    <radialGradient id="sclera" cx="45%" cy="45%" r="65%" fx="40%" fy="40%">
      <stop offset="0%"   stop-color="#f5f0f5"/>
      <stop offset="35%"  stop-color="#e8dff0"/>
      <stop offset="65%"  stop-color="#c9b8d4"/>
      <stop offset="85%"  stop-color="#a894b8"/>
      <stop offset="100%" stop-color="#7a6a88"/>
    </radialGradient>

    <radialGradient id="iris" cx="50%" cy="50%" r="50%" fx="40%" fy="40%">
      <stop offset="0%"   stop-color="#ff4d6d"/>
      <stop offset="20%"  stop-color="#ff0033"/>
      <stop offset="45%"  stop-color="#c40026"/>
      <stop offset="70%"  stop-color="#7a0016"/>
      <stop offset="88%"  stop-color="#4a0008"/>
      <stop offset="100%" stop-color="#2a0004"/>
    </radialGradient>

    <radialGradient id="irisPurple" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#7f5af0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5a3fa0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pupil" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#000000"/>
      <stop offset="60%"  stop-color="#050208"/>
      <stop offset="100%" stop-color="#1a0a20"/>
    </radialGradient>

    <radialGradient id="irisGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#ff0033" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#ff0033" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#ff0033" stop-opacity="0.35"/>
      <stop offset="40%"  stop-color="#7f5af0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2a1533" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="corneaHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- ============================================================
         ФИЛЬТРЫ
         ============================================================ -->

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <filter id="irisTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.9 0.05"
                    numOctaves="3"
                    seed="17"
                    result="noise">
        <animate attributeName="seed" values="17;25;32;25;17" dur="8s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="contrastNoise">
        <feFuncA type="linear" slope="1.8" intercept="-0.4"/>
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="contrastNoise" operator="in" result="masked"/>
      <feBlend in="SourceGraphic" in2="contrastNoise" mode="multiply"/>
    </filter>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5">
        <animate attributeName="seed" values="1;3;5;7;3;1" dur="0.4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>

    <!-- Клип по форме глаза -->
    <clipPath id="eyeShape">
      <path d="M 20 150
               C 70 80, 160 55, 200 55
               C 240 55, 330 80, 380 150
               C 330 220, 240 245, 200 245
               C 160 245, 70 220, 20 150 Z"/>
    </clipPath>

  </defs>

  <!-- ============================================================
       СЛОЙ 1: ВНЕШНЯЯ АУРА (прозрачная к краям)
       ============================================================ -->
  <ellipse cx="200" cy="150" rx="220" ry="140" fill="url(#eyeAura)">
    <animate attributeName="rx" values="200;240;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="130;150;130" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============================================================
       ВСЯ ВНУТРЕННОСТЬ ГЛАЗА — ВНУТРИ CLIP-PATH
       (склера, радужка, зрачок, веки, блики)
       Всё, что выходит за пределы формы — НЕ видно.
       ============================================================ -->
  <g clip-path="url(#eyeShape)">

    <!-- ========================================================
         СЛОЙ 2: СКЛЕРА + ПРОЖИЛКИ
         ======================================================== -->
    <rect x="0" y="0" width="400" height="300" fill="url(#sclera)"/>

    <!-- Красные прожилки -->
    <g stroke="#8b0000" stroke-width="0.8" fill="none" opacity="0.55">
      <path d="M 40 130 Q 60 125 80 128 Q 100 132 115 128"/>
      <path d="M 45 145 Q 70 142 95 148 Q 115 152 130 150"/>
      <path d="M 50 160 Q 75 162 100 158 Q 120 155 135 158"/>
      <path d="M 55 175 Q 80 178 105 172"/>
      <path d="M 360 130 Q 340 125 320 128 Q 300 132 285 128"/>
      <path d="M 355 145 Q 330 142 305 148 Q 285 152 270 150"/>
      <path d="M 350 160 Q 325 162 300 158 Q 280 155 265 158"/>
      <path d="M 345 175 Q 320 178 295 172"/>
    </g>

    <!-- Тонкие прожилки -->
    <g stroke="#c40026" stroke-width="0.4" fill="none" opacity="0.7">
      <path d="M 30 150 Q 55 148 75 152"/>
      <path d="M 370 150 Q 345 148 325 152"/>
      <path d="M 25 165 Q 45 163 65 168"/>
      <path d="M 375 165 Q 355 163 335 168"/>
    </g>

    <!-- Тень сверху века -->
    <path d="M 20 150 C 70 80, 160 55, 200 55
             C 240 55, 330 80, 380 150
             L 380 100 L 20 100 Z"
          fill="#1a0010" opacity="0.35"/>

    <!-- ========================================================
         СЛОЙ 3: РАДУЖКА + ЗРАЧОК
         ======================================================== -->

    <circle cx="200" cy="150" r="80" fill="url(#irisGlow)">
      <animate attributeName="r" values="75;85;75" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <g filter="url(#strongGlow)">
      <circle cx="200" cy="150" r="58" fill="url(#iris)" filter="url(#irisTexture)">
        <animate attributeName="cx" values="190;205;195;200;190" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="145;155;152;148;145" dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="200" cy="150" r="58" fill="url(#irisPurple)" opacity="0.7">
        <animate attributeName="cx" values="190;205;195;200;190" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="145;155;152;148;145" dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="200" cy="150" r="58" fill="none" stroke="#1a0004" stroke-width="6" opacity="0.9">
        <animate attributeName="cx" values="190;205;195;200;190" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="145;155;152;148;145" dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="200" cy="150" r="52" fill="none" stroke="#2a0004" stroke-width="2" opacity="0.7">
        <animate attributeName="cx" values="190;205;195;200;190" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="145;155;152;148;145" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Радиальные волокна -->
    <g stroke="#ff8095" stroke-width="0.8" opacity="0.5">
      <g>
        <animateTransform attributeName="transform"
                          type="rotate"
                          values="0 200 150; 360 200 150"
                          dur="30s" repeatCount="indefinite"/>
        <line x1="200" y1="92" x2="200" y2="105"/>
        <line x1="215" y1="93" x2="212" y2="106"/>
        <line x1="230" y1="98" x2="224" y2="110"/>
        <line x1="245" y1="108" x2="236" y2="118"/>
        <line x1="255" y1="125" x2="245" y2="132"/>
        <line x1="260" y1="145" x2="248" y2="148"/>
        <line x1="258" y1="165" x2="246" y2="163"/>
        <line x1="250" y1="182" x2="240" y2="176"/>
        <line x1="237" y1="195" x2="230" y2="185"/>
        <line x1="220" y1="204" x2="216" y2="192"/>
        <line x1="200" y1="208" x2="200" y2="195"/>
        <line x1="180" y1="204" x2="184" y2="192"/>
        <line x1="163" y1="195" x2="170" y2="185"/>
        <line x1="150" y1="182" x2="160" y2="176"/>
        <line x1="142" y1="165" x2="154" y2="163"/>
        <line x1="140" y1="145" x2="152" y2="148"/>
        <line x1="145" y1="125" x2="155" y2="132"/>
        <line x1="155" y1="108" x2="164" y2="118"/>
        <line x1="170" y1="98" x2="176" y2="110"/>
        <line x1="185" y1="93" x2="188" y2="106"/>
      </g>
    </g>

    <!-- Зрачок -->
    <g filter="url(#strongGlow)">
      <ellipse cx="200" cy="150" rx="22" ry="26" fill="url(#pupil)">
        <animate attributeName="cx" values="190;205;195;200;190" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="145;155;152;148;145" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="22;18;22;26;22" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="26;22;26;30;26" dur="4s" repeatCount="indefinite"/>
      </ellipse>

      <ellipse cx="192" cy="143" rx="4" ry="5" fill="#ff0033" opacity="0.7">
        <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="182;197;187;192;182" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="138;148;145;141;138" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- ========================================================
         СЛОЙ 4: БЛИКИ
         ======================================================== -->
    <ellipse cx="160" cy="105" rx="30" ry="20" fill="url(#corneaHighlight)"
             transform="rotate(-25 160 105)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="230" cy="100" rx="12" ry="7" fill="#ffffff" opacity="0.6"
             transform="rotate(-15 230 100)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <circle cx="140" cy="125" r="2" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="115" r="1.5" fill="#ffffff" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="200" r="1.8" fill="#ff8095" opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- ========================================================
         СЛОЙ 5: ВЕРХНЕЕ ВЕКО — теперь ВНУТРИ клипа
         ======================================================== -->
    <path d="M 20 150 C 70 80, 160 55, 200 55
             C 240 55, 330 80, 380 150
             L 380 -20 L 20 -20 Z"
          fill="#050208">
      <animate attributeName="d"
               values="
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 130, 160 145, 200 148 C 240 145, 330 130, 380 150 L 380 300 L 20 300 Z;
                 M 20 150 C 70 130, 160 145, 200 148 C 240 145, 330 130, 380 150 L 380 300 L 20 300 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 80, 160 55, 200 55 C 240 55, 330 80, 380 150 L 380 -20 L 20 -20 Z"
               dur="7s" repeatCount="indefinite"
               calcMode="spline"
               keyTimes="0;0.5;0.6;0.7;0.75;0.78;0.82;0.85;0.9;1"
               keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </path>

    <!-- ========================================================
         СЛОЙ 6: НИЖНЕЕ ВЕКО — теперь ВНУТРИ клипа
         ======================================================== -->
    <path d="M 20 150 C 70 220, 160 245, 200 245
             C 240 245, 330 220, 380 150
             L 380 320 L 20 320 Z"
          fill="#050208">
      <animate attributeName="d"
               values="
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 130, 160 145, 200 148 C 240 145, 330 130, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 130, 160 145, 200 148 C 240 145, 330 130, 380 150 L 380 -20 L 20 -20 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z;
                 M 20 150 C 70 220, 160 245, 200 245 C 240 245, 330 220, 380 150 L 380 320 L 20 320 Z"
               dur="7s" repeatCount="indefinite"
               calcMode="spline"
               keyTimes="0;0.5;0.6;0.7;0.75;0.78;0.82;0.85;0.9;1"
               keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </path>

    <!-- ========================================================
         СЛОЙ 8: ЗЕРНО (только внутри формы)
         ======================================================== -->
    <rect x="0" y="0" width="400" height="300" filter="url(#grain)" opacity="0.4"/>

  </g>

  <!-- ============================================================
       СЛОЙ 7: КОНТУР ГЛАЗА (СНАРУЖИ CLIP, чтобы было видно обводку)
       ============================================================ -->
  <path d="M 20 150
           C 70 80, 160 55, 200 55
           C 240 55, 330 80, 380 150
           C 330 220, 240 245, 200 245
           C 160 245, 70 220, 20 150 Z"
        fill="none" stroke="#1a0004" stroke-width="3" opacity="0.95"/>

  <path d="M 20 150
           C 70 80, 160 55, 200 55
           C 240 55, 330 80, 380 150
           C 330 220, 240 245, 200 245
           C 160 245, 70 220, 20 150 Z"
        fill="none" stroke="#ff0033" stroke-width="1" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- ============================================================
       СЛОЙ 9: ИСКРЫ (вокруг глаза, на прозрачном фоне)
       ============================================================ -->
  <g fill="#ff4d6d" filter="url(#softGlow)">
    <circle cx="80" cy="60" r="2">
      <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="50" r="1.5">
      <animate attributeName="cy" values="50;30;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="240" r="1.8">
      <animate attributeName="cy" values="240;260;240" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="250" r="2.2">
      <animate attributeName="cy" values="250;270;250" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>