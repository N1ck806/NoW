<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 600"
     width="600"
     height="600"
     preserveAspectRatio="xMidYMid meet">

  <!-- ==============================================================
       NIGHTMARE • WEB
       Паутина, растущая из верхнего левого угла.
       Радиальные нити + спираль + поперечные крепления.
       Прозрачный фон. Анимация «плетения».
       ============================================================== -->

  <defs>

    <!-- ============ ГРАДИЕНТЫ ============ -->

    <!-- Основная нить паутины (от угла к краям) -->
    <radialGradient id="silkFromCorner" cx="0%" cy="0%" r="100%" fx="0%" fy="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#e8dff0" stop-opacity="0.7"/>
      <stop offset="80%"  stop-color="#c9b8d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0.15"/>
    </radialGradient>

    <!-- Спираль (нить между лучами) -->
    <linearGradient id="silkSpiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#c9b8d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Капли росы/крови на нитях -->
    <radialGradient id="dewDrop" cx="35%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#ffb3c0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Свечение в углу (там, где паутина крепится) -->
    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%"   stop-color="#ff0033" stop-opacity="0.4"/>
      <stop offset="40%"  stop-color="#8b0000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a0004" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ ФИЛЬТРЫ ============ -->

    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>

    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>

  </defs>


  <!-- ============================================================
       1. СВЕЧЕНИЕ В УГЛУ (там, где крепится паутина)
       ============================================================ -->
  <ellipse cx="0" cy="0" rx="200" ry="200"
           fill="url(#cornerGlow)" filter="url(#glowBig)"
           opacity="0.7">
    <animate attributeName="rx" values="180;220;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="180;220;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>


  <!-- ============================================================
       2. РАДИАЛЬНЫЕ НИТИ (лучи от угла)
       ============================================================ -->
  <g stroke="url(#silkFromCorner)" fill="none" stroke-linecap="round">

    <!-- Луч 1 (верхний) -->
    <line x1="0" y1="0" x2="450" y2="0" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 500;500 0"
               dur="3s" begin="0s" fill="freeze"/>
    </line>

    <!-- Луч 2 -->
    <line x1="0" y1="0" x2="480" y2="120" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 550;550 0"
               dur="3s" begin="0.2s" fill="freeze"/>
    </line>

    <!-- Луч 3 -->
    <line x1="0" y1="0" x2="500" y2="240" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 600;600 0"
               dur="3s" begin="0.4s" fill="freeze"/>
    </line>

    <!-- Луч 4 (диагональ) -->
    <line x1="0" y1="0" x2="500" y2="380" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 650;650 0"
               dur="3s" begin="0.6s" fill="freeze"/>
    </line>

    <!-- Луч 5 -->
    <line x1="0" y1="0" x2="460" y2="520" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 700;700 0"
               dur="3s" begin="0.8s" fill="freeze"/>
    </line>

    <!-- Луч 6 -->
    <line x1="0" y1="0" x2="380" y2="600" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 700;700 0"
               dur="3s" begin="1s" fill="freeze"/>
    </line>

    <!-- Луч 7 -->
    <line x1="0" y1="0" x2="240" y2="600" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 650;650 0"
               dur="3s" begin="1.2s" fill="freeze"/>
    </line>

    <!-- Луч 8 (левая вертикаль) -->
    <line x1="0" y1="0" x2="0" y2="600" stroke-width="1.2">
      <animate attributeName="stroke-dasharray"
               values="0 600;600 0"
               dur="3s" begin="1.4s" fill="freeze"/>
    </line>

  </g>


  <!-- ============================================================
       3. ПОПЕРЕЧНЫЕ НИТИ (соединяют лучи, растут от центра)
       ============================================================ -->
  <g stroke="url(#silkSpiral)" fill="none" stroke-linecap="round" stroke-width="0.9">

    <!-- Кольцо 1 (ближнее к углу) -->
    <path d="M 60 0 Q 75 30 90 60 Q 100 90 85 110 Q 60 100 40 80 Q 20 60 0 40 Q 0 20 20 10 Q 40 5 60 0">
      <animate attributeName="stroke-dasharray"
               values="0 400;400 0"
               dur="2s" begin="2s" fill="freeze"/>
    </path>

    <!-- Кольцо 2 -->
    <path d="M 130 0 Q 160 60 180 120 Q 195 165 175 200 Q 145 195 120 175 Q 90 150 60 120 Q 35 90 10 60 Q 5 30 30 15 Q 60 5 90 3 Q 115 0 130 0">
      <animate attributeName="stroke-dasharray"
               values="0 600;600 0"
               dur="2.5s" begin="2.3s" fill="freeze"/>
    </path>

    <!-- Кольцо 3 -->
    <path d="M 200 0 Q 240 90 270 170 Q 290 230 265 280 Q 220 275 185 250 Q 145 220 110 180 Q 75 140 40 100 Q 15 70 5 40 Q 5 20 25 10 Q 60 3 110 2 Q 160 0 200 0">
      <animate attributeName="stroke-dasharray"
               values="0 800;800 0"
               dur="3s" begin="2.6s" fill="freeze"/>
    </path>

    <!-- Кольцо 4 -->
    <path d="M 280 0 Q 330 120 370 220 Q 390 290 355 350 Q 300 345 255 315 Q 205 280 160 235 Q 115 190 75 145 Q 40 105 15 65 Q 5 40 5 20 Q 30 10 80 5 Q 160 0 220 0 Q 260 0 280 0">
      <animate attributeName="stroke-dasharray"
               values="0 1000;1000 0"
               dur="3.5s" begin="3s" fill="freeze"/>
    </path>

    <!-- Кольцо 5 -->
    <path d="M 360 0 Q 420 150 460 270 Q 480 350 445 420 Q 380 415 330 380 Q 275 340 220 290 Q 165 240 115 190 Q 75 150 45 110 Q 25 80 20 55 Q 40 30 90 15 Q 180 2 260 0 Q 320 0 360 0">
      <animate attributeName="stroke-dasharray"
               values="0 1200;1200 0"
               dur="4s" begin="3.4s" fill="freeze"/>
    </path>

    <!-- Кольцо 6 (внешнее) -->
    <path d="M 440 0 Q 510 180 550 310 Q 575 400 535 480 Q 460 475 400 435 Q 340 390 275 335 Q 215 285 160 230 Q 115 190 80 145 Q 55 110 45 80 Q 65 45 120 25 Q 220 5 320 2 Q 390 0 440 0">
      <animate attributeName="stroke-dasharray"
               values="0 1400;1400 0"
               dur="4.5s" begin="3.8s" fill="freeze"/>
    </path>

  </g>


  <!-- ============================================================
       4. ДОПОЛНИТЕЛЬНЫЕ ВНУТРЕННИЕ НИТИ (мелкая сетка)
       ============================================================ -->
  <g stroke="url(#silkSpiral)" fill="none" stroke-width="0.6" opacity="0.7">

    <!-- Диагональные растяжки внутри -->
    <path d="M 90 60 Q 130 110 175 175">
      <animate attributeName="stroke-dasharray"
               values="0 200;200 0"
               dur="1.5s" begin="4.5s" fill="freeze"/>
    </path>
    <path d="M 200 0 Q 230 80 250 160">
      <animate attributeName="stroke-dasharray"
               values="0 250;250 0"
               dur="1.5s" begin="4.7s" fill="freeze"/>
    </path>
    <path d="M 320 0 Q 350 100 380 200">
      <animate attributeName="stroke-dasharray"
               values="0 300;300 0"
               dur="1.8s" begin="4.9s" fill="freeze"/>
    </path>
    <path d="M 0 120 Q 80 145 160 175">
      <animate attributeName="stroke-dasharray"
               values="0 250;250 0"
               dur="1.5s" begin="5.1s" fill="freeze"/>
    </path>
    <path d="M 0 260 Q 100 290 200 320">
      <animate attributeName="stroke-dasharray"
               values="0 300;300 0"
               dur="1.8s" begin="5.3s" fill="freeze"/>
    </path>

    <!-- Внутренние короткие нити между кольцами -->
    <path d="M 110 60 Q 130 100 145 130">
      <animate attributeName="stroke-dasharray"
               values="0 150;150 0"
               dur="1.2s" begin="5.5s" fill="freeze"/>
    </path>
    <path d="M 180 100 Q 210 140 225 175">
      <animate attributeName="stroke-dasharray"
               values="0 150;150 0"
               dur="1.2s" begin="5.7s" fill="freeze"/>
    </path>
    <path d="M 60 180 Q 90 200 120 220">
      <animate attributeName="stroke-dasharray"
               values="0 150;150 0"
               dur="1.2s" begin="5.9s" fill="freeze"/>
    </path>
  </g>


  <!-- ============================================================
       5. КАПЛИ РОСЫ / КРОВИ НА НИТЯХ (появляются в конце)
       ============================================================ -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1" dur="7s" fill="freeze"/>

    <!-- Капля 1 -->
    <circle cx="120" cy="60" r="2.5" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="r" values="2.5;3;2.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Капля 2 -->
    <circle cx="245" cy="150" r="3" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="r" values="3;3.5;3" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Капля 3 -->
    <circle cx="80" cy="180" r="2" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="r" values="2;2.5;2" dur="2.8s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Капля 4 -->
    <circle cx="370" cy="230" r="3.5" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="r" values="3.5;4;3.5" dur="4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Капля 5 -->
    <circle cx="180" cy="290" r="2.2" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="r" values="2.2;2.7;2.2" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Капля 6 (падающая) -->
    <circle cx="255" cy="315" r="2" fill="url(#dewDrop)" filter="url(#glowStrong)">
      <animate attributeName="cy" values="315;400;500" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>


  <!-- ============================================================
       6. МЕЛКИЕ ПАУЧКИ НА ПАУТИНЕ (появляются в конце)
       ============================================================ -->
  <g opacity="0" fill="#0a0002">
    <animate attributeName="opacity" values="0;0;0;1" dur="8s" fill="freeze"/>

    <!-- Паучок 1 (в верхней части) -->
    <g>
      <circle cx="180" cy="130" r="3"/>
      <line x1="180" y1="130" x2="174" y2="126" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="180" y1="130" x2="186" y2="126" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="180" y1="130" x2="174" y2="134" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="180" y1="130" x2="186" y2="134" stroke="#0a0002" stroke-width="0.7"/>
      <circle cx="180" cy="130" r="0.8" fill="#ff0033"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; 4 -2; 0 0"
                        dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Паучок 2 (средний) -->
    <g>
      <circle cx="330" cy="260" r="4"/>
      <line x1="330" y1="260" x2="323" y2="255" stroke="#0a0002" stroke-width="0.8"/>
      <line x1="330" y1="260" x2="337" y2="255" stroke="#0a0002" stroke-width="0.8"/>
      <line x1="330" y1="260" x2="323" y2="265" stroke="#0a0002" stroke-width="0.8"/>
      <line x1="330" y1="260" x2="337" y2="265" stroke="#0a0002" stroke-width="0.8"/>
      <circle cx="330" cy="260" r="1" fill="#ff0033"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; -3 -3; 0 0"
                        dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Паучок 3 (нижний) -->
    <g>
      <circle cx="120" cy="340" r="3.5"/>
      <line x1="120" y1="340" x2="113" y2="335" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="120" y1="340" x2="127" y2="335" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="120" y1="340" x2="113" y2="345" stroke="#0a0002" stroke-width="0.7"/>
      <line x1="120" y1="340" x2="127" y2="345" stroke="#0a0002" stroke-width="0.7"/>
      <circle cx="120" cy="340" r="0.9" fill="#ff0033"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; 5 -4; 0 0"
                        dur="6s" repeatCount="indefinite"/>
    </g>
  </g>


  <!-- ============================================================
       7. МЕРЦАНИЕ (лёгкое дыхание паутины)
       ============================================================ -->
  <rect x="0" y="0" width="600" height="600"
        fill="#7f5af0" opacity="0" filter="url(#glowBig)">
    <animate attributeName="opacity"
             values="0;0;0.05;0;0;0;0.03;0"
             dur="6s" repeatCount="indefinite"/>
  </rect>


</svg>