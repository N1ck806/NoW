<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 60"
     width="200"
     height="60"
     preserveAspectRatio="xMidYMid meet">

  <!-- ==============================================================
       NIGHTMARE • ROLE: GHOST (v2 — читаемый текст)
       ============================================================== -->

  <defs>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a0a2a"/>
      <stop offset="50%"  stop-color="#0a0610"/>
      <stop offset="100%" stop-color="#150a25"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7f5af0">
        <animate attributeName="stop-color"
                 values="#7f5af0;#a78bfa;#00e5ff;#7f5af0"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#a78bfa">
        <animate attributeName="stop-color"
                 values="#a78bfa;#00e5ff;#7f5af0;#a78bfa"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color"
                 values="#00e5ff;#7f5af0;#a78bfa;#00e5ff"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- НОВЫЙ: текст — почти белый -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#e8dff0"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="ghostBody" cx="50%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%"  stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="75%"  stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7f5af0" stop-opacity="0.4"/>
    </radialGradient>

    <radialGradient id="ghostAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="60%"  stop-color="#7f5af0" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5a3fa0" stop-opacity="0"/>
    </radialGradient>

    <filter id="ghostGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <clipPath id="roundedBadge">
      <rect x="0" y="0" width="200" height="60" rx="30" ry="30"/>
    </clipPath>

  </defs>

  <!-- ФОН -->
  <rect x="0" y="0" width="200" height="60" rx="30" ry="30"
        fill="url(#bgGrad)"/>

  <rect x="0" y="0" width="200" height="60" rx="30" ry="30"
        fill="url(#ghostAura)" clip-path="url(#roundedBadge)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ОБВОДКА (переливается) -->
  <rect x="0" y="0" width="200" height="60" rx="30" ry="30"
        fill="none" stroke="url(#borderGrad)" stroke-width="1.8"
        filter="url(#softGlow)">
    <animate attributeName="stroke-width" values="1.5;2.2;1.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ИКОНКА — ПРИЗРАК -->
  <g transform="translate(30 30)">
    <ellipse cx="0" cy="-2" rx="20" ry="20"
             fill="url(#ghostAura)" filter="url(#softGlow)">
      <animate attributeName="rx" values="18;22;18" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="18;22;18" dur="3s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#ghostGlow)">
      <path d="M -10 -12
               Q -10 -20, 0 -20
               Q 10 -20, 10 -12
               L 10 6
               Q 7 4, 5 6
               Q 2 8, 0 6
               Q -2 8, -5 6
               Q -7 4, -10 6 Z"
            fill="url(#ghostBody)">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0; 0 -1.5; 0 0; 0 1.5; 0 0"
                          dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="0.9;1;0.9;0.75;0.9"
                 dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ГЛАЗА -->
    <ellipse cx="-4" cy="-12" rx="1.8" ry="2.2" fill="#0a0610">
      <animate attributeName="ry"
               values="2.2;2.2;2.2;2.2;2.2;0.3;2.2;2.2;2.2;2.2;2.2;2.2;2.2;0.3;2.2"
               dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="4" cy="-12" rx="1.8" ry="2.2" fill="#0a0610">
      <animate attributeName="ry"
               values="2.2;2.2;2.2;2.2;2.2;0.3;2.2;2.2;2.2;2.2;2.2;2.2;2.2;0.3;2.2"
               dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Свечение глаз -->
    <ellipse cx="-4" cy="-12" rx="2.5" ry="3" fill="#00e5ff" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="4" cy="-12" rx="2.5" ry="3" fill="#00e5ff" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Шлейф снизу -->
    <ellipse cx="0" cy="8" rx="8" ry="3" fill="#7f5af0" opacity="0.5"
             filter="url(#softGlow)">
      <animate attributeName="rx" values="7;10;7" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- ПОДЛОЖКА ПОД ТЕКСТОМ (тёмная полоса для читаемости) -->
  <rect x="60" y="12" width="130" height="24" rx="6"
        fill="#000000" opacity="0.4"/>

  <!-- ТЕКСТ — с обводкой -->
  <text x="120" y="28"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="18"
        font-weight="900"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#textGrad)"
        stroke="#0a0610"
        stroke-width="3"
        paint-order="stroke fill"
        filter="url(#ghostGlow)">
    ПРИЗРАК

    <animate attributeName="opacity"
             values="1;1;1;1;1;0.75;1;1;1;1;1;1;1;0.85;1"
             dur="7s" repeatCount="indefinite"/>
  </text>

  <!-- Тонкая светлая обводка -->
  <text x="120" y="28"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="18"
        font-weight="900"
        letter-spacing="4"
        text-anchor="middle"
        fill="none"
        stroke="#e8dff0"
        stroke-width="0.7"
        opacity="0.85">
    ПРИЗРАК
  </text>

  <!-- Подпись снизу -->
  <text x="120" y="48"
        font-family="'Inter', sans-serif"
        font-size="9"
        letter-spacing="2"
        text-anchor="middle"
        fill="#a78bfa"
        stroke="#0a0610"
        stroke-width="2"
        paint-order="stroke fill">
    УЧАСТНИК КЛАНА

    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- ЧАСТИЦЫ ВОКРУГ -->
  <g filter="url(#softGlow)">
    <circle cx="80" cy="15" r="1.2" fill="#a78bfa">
      <animate attributeName="cy" values="15;8;15" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="45" r="1" fill="#00e5ff">
      <animate attributeName="cy" values="45;35;45" dur="5s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="20" r="1.3" fill="#7f5af0">
      <animate attributeName="cy" values="20;10;20" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>