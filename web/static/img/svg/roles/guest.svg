<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 60"
     width="200"
     height="60"
     preserveAspectRatio="xMidYMid meet">

  <!-- ==============================================================
       NIGHTMARE • ROLE: GUEST (v2 — читаемый текст)
       ============================================================== -->

  <defs>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5a5a6a"/>
      <stop offset="50%"  stop-color="#8a92a6"/>
      <stop offset="100%" stop-color="#5a5a6a"/>
    </linearGradient>

    <!-- НОВЫЙ: текст — почти белый с серым градиентом -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#b0b4be"/>
    </linearGradient>

    <radialGradient id="iconGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"   stop-color="#b0b4be"/>
      <stop offset="60%"  stop-color="#8a92a6"/>
      <stop offset="100%" stop-color="#5a5a6a"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedBadge">
      <rect x="0" y="0" width="200" height="60" rx="30" ry="30"/>
    </clipPath>

  </defs>

  <!-- ФОН -->
  <rect x="0" y="0" width="200" height="60" rx="30" ry="30"
        fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Пульс обводки -->
  <rect x="0" y="0" width="200" height="60" rx="30" ry="30"
        fill="none" stroke="#8a92a6" stroke-width="1"
        opacity="0.4" clip-path="url(#roundedBadge)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ИКОНКА -->
  <g transform="translate(30 30)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="18" fill="#0a0a12" stroke="#5a5a6a" stroke-width="1"/>
    <circle cx="0" cy="-4" r="6" fill="url(#iconGrad)" opacity="0.9"/>
    <path d="M -10 12 Q -10 5 0 5 Q 10 5 10 12 L 10 15 L -10 15 Z"
          fill="url(#iconGrad)" opacity="0.9"/>
  </g>

  <!-- ПОДЛОЖКА ПОД ТЕКСТОМ (тёмная полоса) -->
  <rect x="60" y="12" width="130" height="24" rx="6"
        fill="#000000" opacity="0.35"/>

  <!-- ТЕКСТ — с обводкой для читаемости -->
  <text x="120" y="28"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="18"
        font-weight="900"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#textGrad)"
        stroke="#0a0a12"
        stroke-width="3"
        paint-order="stroke fill">
    ГОСТЬ
  </text>

  <!-- Обводка сверху (светлая тонкая) -->
  <text x="120" y="28"
        font-family="'Impact', 'Arial Black', sans-serif"
        font-size="18"
        font-weight="900"
        letter-spacing="4"
        text-anchor="middle"
        fill="none"
        stroke="#8a92a6"
        stroke-width="0.6"
        opacity="0.8">
    ГОСТЬ
  </text>

  <!-- Подпись снизу -->
  <text x="120" y="48"
        font-family="'Inter', sans-serif"
        font-size="9"
        letter-spacing="2"
        text-anchor="middle"
        fill="#8a92a6"
        stroke="#0a0a12"
        stroke-width="2"
        paint-order="stroke fill">
    НЕ УЧАСТНИК
  </text>

</svg>