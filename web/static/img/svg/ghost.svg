<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 700"
     width="500"
     height="700"
     preserveAspectRatio="xMidYMid meet">

  <defs>

    <linearGradient id="ghostBody" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#e8dff0" stop-opacity="0.9"/>
      <stop offset="20%"  stop-color="#c9b8d4" stop-opacity="0.75"/>
      <stop offset="45%"  stop-color="#a894b8" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#7f5af0" stop-opacity="0.35"/>
      <stop offset="90%"  stop-color="#5a3fa0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a1533" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ghostGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="40%"  stop-color="#7f5af0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a1533" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#ff8095" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#ff0033" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ghostTail" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#7f5af0" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#5a3fa0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1533" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auraOuter" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#7f5af0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2a1533" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fadeMaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="fadeBottom" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="700">
      <rect x="0" y="0" width="500" height="700" fill="url(#fadeMaskGrad)"/>
    </mask>

    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>

    <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>

    <filter id="wispy" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.03 0.05"
                    numOctaves="3"
                    seed="21"
                    result="wisp"/>
      <feDisplacementMap in="SourceGraphic" in2="wisp" scale="8"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="distort" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.04 0.06"
                    numOctaves="2"
                    seed="9"
                    result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>

  </defs>

  <g mask="url(#fadeBottom)">

    <g filter="url(#glowBig)" opacity="0.6">
      <ellipse cx="250" cy="320" rx="180" ry="240" fill="url(#auraOuter)">
        <animate attributeName="rx" values="170;195;170" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="230;255;230" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="250" cy="320" rx="140" ry="200" fill="url(#ghostGlow)">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g filter="url(#wispy)">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0; 0 -6; 0 0"
                        dur="6s"
                        repeatCount="indefinite"/>
      <path d="M 250 80
               C 200 80, 160 130, 160 190
               C 160 230, 175 260, 175 300
               C 175 350, 160 400, 155 460
               C 150 520, 170 580, 200 640
               C 220 670, 240 690, 250 700
               C 260 690, 280 670, 300 640
               C 330 580, 350 520, 345 460
               C 340 400, 325 350, 325 300
               C 325 260, 340 230, 340 190
               C 340 130, 300 80, 250 80 Z"
            fill="url(#ghostBody)"/>
      <path d="M 250 120
               C 215 120, 190 160, 190 210
               C 190 250, 205 280, 205 320
               C 205 370, 195 420, 195 470
               C 195 520, 210 570, 225 620
               C 235 645, 245 665, 250 680
               C 255 665, 265 645, 275 620
               C 290 570, 305 520, 305 470
               C 305 420, 295 370, 295 320
               C 295 280, 310 250, 310 210
               C 310 160, 285 120, 250 120 Z"
            fill="#2a1533" opacity="0.35"/>
    </g>

    <ellipse cx="250" cy="320" rx="90" ry="140"
             fill="url(#ghostGlow)"
             filter="url(#glowSoft)"
             opacity="0.6">
      <animate attributeName="opacity" values="0.4;0.75;0.4" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="130;155;130" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <g filter="url(#glowStrong)">
      <ellipse cx="215" cy="190" rx="14" ry="9" fill="url(#eyeGlow)">
        <animate attributeName="ry" values="9;9;9;9;9;1;9;9;9" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="285" cy="190" rx="14" ry="9" fill="url(#eyeGlow)">
        <animate attributeName="ry" values="9;9;9;9;9;1;9;9;9" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="215" cy="190" r="3" fill="#0a0002">
        <animate attributeName="r" values="3;3;3;3;3;0.5;3;3;3" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="285" cy="190" r="3" fill="#0a0002">
        <animate attributeName="r" values="3;3;3;3;3;0.5;3;3;3" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#glowSoft)" opacity="0.7">
      <ellipse cx="215" cy="190" rx="30" ry="22" fill="#ff0033">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="285" cy="190" rx="30" ry="22" fill="#ff0033">
        <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <path d="M 230 230 Q 250 245 270 230"
          stroke="#ff8095" stroke-width="1.5" fill="none"
          filter="url(#glowStrong)" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </path>

    <g filter="url(#wispy)" opacity="0.7">
      <path d="M 200 640
               C 180 660, 150 680, 130 700
               C 180 700, 200 690, 220 680
               C 200 690, 180 700, 160 700
               C 210 700, 240 690, 250 685
               C 260 690, 290 700, 340 700
               C 320 700, 300 690, 280 680
               C 300 690, 320 700, 370 700
               C 350 680, 320 660, 300 640
               C 280 660, 260 680, 250 690
               C 240 680, 220 660, 200 640 Z"
            fill="url(#ghostTail)">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="5s" repeatCount="indefinite"/>
      </path>
    </g>

    <g filter="url(#glowBig)" opacity="0.4">
      <ellipse cx="150" cy="450" rx="60" ry="80" fill="#7f5af0">
        <animate attributeName="cx" values="150;170;140;150" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="450;430;470;450" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="60;75;55;60" dur="6s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="350" cy="470" rx="65" ry="85" fill="#7f5af0">
        <animate attributeName="cx" values="350;330;360;350" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="470;450;490;470" dur="8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="250" cy="600" rx="120" ry="60" fill="#5a3fa0">
        <animate attributeName="rx" values="100;130;100" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g filter="url(#glowBig)" opacity="0.25">
      <ellipse cx="120" cy="120" rx="70" ry="40" fill="#a78bfa">
        <animate attributeName="cy" values="120;80;120" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="390" cy="140" rx="80" ry="45" fill="#a78bfa">
        <animate attributeName="cy" values="140;100;140" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.3;0.1" dur="9s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g filter="url(#glowStrong)">
      <circle cx="180" cy="300" r="1.5" fill="#a78bfa">
        <animate attributeName="cy" values="300;260;300" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="180;160;180" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="320" cy="280" r="1.8" fill="#a78bfa">
        <animate attributeName="cy" values="280;240;280" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="320;340;320" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="230" cy="380" r="1.2" fill="#e8dff0">
        <animate attributeName="cy" values="380;340;380" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="420" r="1.5" fill="#e8dff0">
        <animate attributeName="cy" values="420;380;420" dur="5.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="270;290;270" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="500" r="1.3" fill="#a78bfa">
        <animate attributeName="cy" values="500;460;500" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="300" cy="520" r="1.5" fill="#a78bfa">
        <animate attributeName="cy" values="520;480;520" dur="5.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="300;280;300" dur="6.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="5.8s" repeatCount="indefinite"/>
      </circle>
    </g>

  </g>

</svg>