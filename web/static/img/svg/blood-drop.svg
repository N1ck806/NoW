<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 400"
     width="200"
     height="400"
     preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- ============ ГРАДИЕНТЫ ============ -->

    <!-- Основной градиент капли (сверху светлое, снизу тёмное) -->
    <radialGradient id="dropMain" cx="35%" cy="30%" r="80%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#ff6680"/>
      <stop offset="15%" stop-color="#ff2044"/>
      <stop offset="45%" stop-color="#c40026"/>
      <stop offset="75%" stop-color="#7a0016"/>
      <stop offset="100%" stop-color="#3a0008"/>
    </radialGradient>

    <!-- Градиент блика (слева сверху) -->
    <radialGradient id="dropHighlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffb3c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb3c0" stop-opacity="0"/>
    </radialGradient>

    <!-- Внутреннее свечение -->
    <radialGradient id="dropInnerGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0"/>
    </radialGradient>

    <!-- Градиент для хвоста капли -->
    <linearGradient id="dropTail" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ff2044" stop-opacity="0"/>
      <stop offset="30%" stop-color="#c40026" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7a0016" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3a0008" stop-opacity="1"/>
    </linearGradient>

    <!-- Градиент ауры вокруг -->
    <radialGradient id="dropAura" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b0000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ ФИЛЬТРЫ ============ -->

    <!-- Свечение (glow) -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Мягкое свечение -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>

    <!-- Внутренняя тень -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="2" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>

    <!-- Обрезка капли (чтобы элементы не выходили за контур) -->
    <clipPath id="dropClip">
      <path d="M 100 30
               C 130 120, 160 200, 160 270
               C 160 340, 130 380, 100 380
               C 70 380, 40 340, 40 270
               C 40 200, 70 120, 100 30 Z"/>
    </clipPath>
  </defs>

  <!-- ============================================================
       СЛОЙ 1: АУРА СВЕЧЕНИЯ ВОКРУГ
       ============================================================ -->
  <ellipse cx="100" cy="270" rx="90" ry="130"
           fill="url(#dropAura)"
           filter="url(#softGlow)">
    <animate attributeName="rx" values="80;100;80" dur="3s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="ry" values="120;140;120" dur="3s" repeatCount="indefinite"
             calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============================================================
       СЛОЙ 2: ХВОСТ КАПЛИ (ТОНКИЙ, СВЕРХУ)
       ============================================================ -->
  <path d="M 100 20
           Q 95 60, 100 100
           Q 105 60, 100 20 Z"
        fill="url(#dropTail)">
    <animate attributeName="d"
             values="
               M 100 20 Q 95 60, 100 100 Q 105 60, 100 20 Z;
               M 100 15 Q 94 60, 100 105 Q 106 60, 100 15 Z;
               M 100 20 Q 95 60, 100 100 Q 105 60, 100 20 Z"
             dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- ============================================================
       СЛОЙ 3: ОСНОВНОЕ ТЕЛО КАПЛИ
       ============================================================ -->
  <g filter="url(#glow)">
    <path d="M 100 30
             C 130 120, 160 200, 160 270
             C 160 340, 130 380, 100 380
             C 70 380, 40 340, 40 270
             C 40 200, 70 120, 100 30 Z"
          fill="url(#dropMain)">
      <!-- Лёгкое дыхание формы -->
      <animate attributeName="d"
               values="
                 M 100 30 C 130 120, 160 200, 160 270 C 160 340, 130 380, 100 380 C 70 380, 40 340, 40 270 C 40 200, 70 120, 100 30 Z;
                 M 100 25 C 132 118, 162 200, 162 272 C 162 342, 132 382, 100 382 C 68 382, 38 342, 38 272 C 38 200, 68 118, 100 25 Z;
                 M 100 30 C 130 120, 160 200, 160 270 C 160 340, 130 380, 100 380 C 70 380, 40 340, 40 270 C 40 200, 70 120, 100 30 Z"
               dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- ============ ВНУТРЕННИЕ ЭЛЕМЕНТЫ (в clip) ============ -->
    <g clip-path="url(#dropClip)">

      <!-- Внутреннее свечение снизу -->
      <ellipse cx="100" cy="340" rx="70" ry="50" fill="url(#dropInnerGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Тёмное ядро (эффект глубины) -->
      <ellipse cx="100" cy="270" rx="50" ry="90" fill="#3a0008" opacity="0.4">
        <animate attributeName="rx" values="45;55;45" dur="4s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Плавающие пузырьки внутри -->
      <circle cx="80" cy="200" r="4" fill="#ffb3c0" opacity="0.5">
        <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="240" r="3" fill="#ffb3c0" opacity="0.4">
        <animate attributeName="cy" values="240;220;240" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="120;125;120" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="90" cy="300" r="5" fill="#ff8095" opacity="0.3">
        <animate attributeName="cy" values="300;280;300" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="115" cy="330" r="3.5" fill="#ffb3c0" opacity="0.45">
        <animate attributeName="cy" values="330;310;330" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="75" cy="270" r="2.5" fill="#ff8095" opacity="0.5">
        <animate attributeName="cy" values="270;255;270" dur="3.2s" repeatCount="indefinite"/>
      </circle>

      <!-- Тёмные разводы (эффект густой крови) -->
      <ellipse cx="70" cy="290" rx="20" ry="30" fill="#1a0004" opacity="0.35">
        <animate attributeName="rx" values="18;22;18" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="130" cy="320" rx="15" ry="25" fill="#1a0004" opacity="0.3">
        <animate attributeName="rx" values="13;17;13" dur="6s" repeatCount="indefinite"/>
      </ellipse>

    </g>

    <!-- ============ БЛИК (СВЕРХУ, БЕЗ CLIP) ============ -->
    <ellipse cx="80" cy="120" rx="20" ry="40"
             fill="url(#dropHighlight)"
             transform="rotate(-15 80 120)">
      <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Маленький блеск справа -->
    <circle cx="125" cy="150" r="4" fill="#ffffff" opacity="0.7">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- ============================================================
       СЛОЙ 4: ИСКРЫ ВОКРУГ
       ============================================================ -->
  <g fill="#ff0033">
    <circle cx="60" cy="350" r="2.5">
      <animate attributeName="cy" values="350;330;350" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="340" r="2">
      <animate attributeName="cy" values="340;320;340" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="280" r="1.5">
      <animate attributeName="cx" values="50;45;50" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="260" r="2">
      <animate attributeName="cx" values="150;155;150" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================
       СЛОЙ 5: МЕЛКИЕ КАПЛИ-СПУТНИКИ (отрываются от капли)
       ============================================================ -->
  <g fill="#c40026">
    <!-- Маленькая капля слева -->
    <path d="M 45 380 Q 42 390 45 395 Q 48 390 45 380 Z" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0.8;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="d"
               values="
                 M 45 380 Q 42 390 45 395 Q 48 390 45 380 Z;
                 M 45 380 Q 42 395 45 405 Q 48 395 45 380 Z;
                 M 45 380 Q 42 400 45 415 Q 48 400 45 380 Z"
               dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Маленькая капля справа -->
    <path d="M 155 375 Q 152 385 155 390 Q 158 385 155 375 Z" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0.7;0.7;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="d"
               values="
                 M 155 375 Q 152 385 155 390 Q 158 385 155 375 Z;
                 M 155 375 Q 152 390 155 400 Q 158 390 155 375 Z;
                 M 155 375 Q 152 395 155 410 Q 158 395 155 375 Z"
               dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ============================================================
       СЛОЙ 6: ДЫМКА (атмосфера вокруг)
       ============================================================ -->
  <g opacity="0.15" filter="url(#softGlow)">
    <ellipse cx="100" cy="360" rx="80" ry="30" fill="#ff0033">
      <animate attributeName="rx" values="70;90;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

</svg>